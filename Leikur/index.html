<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lestarvandamálið</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://code.jquery.com/jquery-3.7.1.js" 
    integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" 
    crossorigin="anonymous">
    </script>
</head>
<body>
    <div id="container">
        <div id="titllBord"></div>
        <div id="canvasBox">
            <canvas id="leikbord" width="1200" height="700"></canvas>
            <img class="jbHaus" src="./Img/JB/Johann3.png">
        </div>
        
        <div id="atburdarTextiBox">
            <p id="atburdarTexti">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quia voluptatibus corrupti, 
                ratione dicta magnam velit expedita repellat, consequuntur possimus, autem amet ea consectetur incidunt numquam. Vitae sed ipsum quasi quo?</p>
        </div>
        <div id="takkar">
            <button id="pullLever">Taka í stöng</button>
            <button id="noPullLever">Gera ekkert</button>
            <button id="næstaBorð">Næsta Borð</button>
        </div>
        
    </div>
    

    <script src="index.js"></script>
    <script>
        $("#næstaBorð").hide();
        $("#pullLever").click(function(){
            $("#pullLever").hide();
            $("#noPullLever").hide();
            $("#næstaBorð").show().css({"position": "relative","opacity": 0, "left": "+=100"});
            $("#næstaBorð").animate({left:0, opacity:1}, 4000);

        });
        $("#noPullLever").click(function(){
            $("#pullLever").hide();
            $("#noPullLever").hide();
            $("#næstaBorð").show().css({"position": "relative","opacity": 0, "left": "+=100"});
            $("#næstaBorð").animate({left:0, opacity:1}, 4000);
            
        });
        $("#næstaBorð").click(function(){
            $("#næstaBorð").hide();
            $("#pullLever").show();
            $("#noPullLever").show();
        })
    </script>
</body>
</html>
